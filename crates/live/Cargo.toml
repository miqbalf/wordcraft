[package]
name = "wordcraft-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft live co-editing: maps a Document's body to and from craft-collab's shared block document, so sessions editing the same file converge"

[lints]
workspace = true

[features]
# `testing`: an in-memory relay, so a host's interface tests (ui-egui) can join a real
# `LiveEditing` with no server. Dev-dependencies only.
test-util = []

[dependencies]
craft-collab = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
