[package]
name = "wordcraft-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft live co-editing: maps a Document's body to and from craft-collab's shared block document, so sessions editing the same file converge"

[lints]
workspace = true

[features]
# `testing`: an in-memory relay, so a host's interface tests (ui-egui) can join a real
# `LiveEditing` with no server. Dev-dependencies only.
test-util = ["craft-live/test-util"]
# The native socket transport: the desktop window's join (`desktop`), and the tests that join a
# real craft-collab relay.
native-hub = ["craft-collab/native-hub", "dep:tokio"]

[dependencies]
craft-collab = { workspace = true }
craft-live = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The desktop join's relay link runs on a runtime of its own (feature `native-hub`); already in
# the build through craft-collab's native hub.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"], optional = true }

[dev-dependencies]
# Mint relay tickets (HMAC-SHA256 over the base64url payload) and drive the native hub.
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# The desktop session file's tests write it in a scratch folder.
tempfile = "3"
