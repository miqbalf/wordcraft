[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[lib]
name = "wordcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
# live-worker: the document service of live co-editing. The worker loop is craft-live-worker's,
# shared by every Craft app; src/live_worker.rs is WordCraft's document service on it.
wordcraft-live = { workspace = true }
craft-collab = { workspace = true, features = ["native-hub"] }
craft-live = { workspace = true }
craft-live-worker = { workspace = true }
log = { workspace = true }

[dev-dependencies]
wordcraft-fonts = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
image = { workspace = true }
craft-zip = { workspace = true }
sha1 = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
# The live-worker tests: a fake Nextcloud (axum) checking the worker's signatures, and relay
# tickets minted the way the app mints them.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
