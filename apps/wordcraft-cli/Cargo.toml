[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[lib]
name = "wordcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
# live-worker: the document service of live co-editing (see src/live_worker.rs).
wordcraft-live = { workspace = true }
craft-collab = { workspace = true, features = ["native-hub"] }
serde = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
# The notify endpoint: one small HTTP/1 route, on the hyper and tokio already in the build.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The Nextcloud file API. 0.12 with native-tls is what the socket client already builds.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[dev-dependencies]
wordcraft-fonts = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
image = { workspace = true }
craft-zip = { workspace = true }
sha1 = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
